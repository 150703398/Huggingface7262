<p id="p1">老年痴呆症通常指阿尔茨海默病，是一种慢性、进行性的神经退行性疾病，并非正常衰老。</p>

<section>
<h2 id="h2">常见症状</h2>
<ul id="list1">
<li>近期记忆力明显下降</li>
<li>容易迷路或搞混时间</li>
<li>语言表达困难</li>
<li>性格与情绪改变</li>
</ul>
</section>

<section>
<h2 id="h3">早期自测（非诊断）</h2>
<ul id="list2">
<li>是否经常忘记刚发生的事情？</li>
<li>是否反复询问同样问题？</li>
<li>是否对熟悉的路线感到陌生？</li>
</ul>
<p id="p2">如多项为“是”，建议尽早前往正规医院就诊。</p>
</section>
