<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>老年痴呆症（阿尔茨海默病）科普</title>
<style>
body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f7fa;color:#222;line-height:1.8;font-size:18px}
header{background:#1f4fd8;color:#fff;padding:30px 15px;text-align:center}
header h1{margin:0;font-size:2.2em}
header p{margin:8px 0 0}
.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px;background:#fff;border-bottom:1px solid #ddd}
button{font-size:16px;padding:8px 14px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
main{max-width:960px;margin:20px auto;padding:0 15px}
section{background:#fff;border-radius:10px;padding:24px;margin-bottom:22px;border:1px solid #e5e5e5}
h2{color:#1f4fd8;margin-top:0}
ul{padding-left:22px}
.img-box{text-align:center;margin:20px 0}
.img-box img{max-width:100%;height:auto;border-radius:8px}
body.big-font{font-size:22px}
footer{text-align:center;font-size:14px;color:#666;padding:20px}
@media print{.toolbar{display:none}body{background:#fff;color:#000;font-size:14px}}
</style>
</head>
<body>
<header>
<h1 id="title">老年痴呆症（阿尔茨海默病）</h1>
<p id="subtitle">认识疾病 · 早期发现 · 科学照护</p>
</header>

<div class="toolbar">
<button onclick="switchLang()">🌍 中文 / English</button>
<button onclick="toggleFont()">👓 老年友好大字</button>
<button onclick="window.print()">🖨 打印 / PDF</button>
</div>

<main>
<section>
<h2 id="h1">什么是老年痴呆症？</h2>
<p id="p1">老年痴呆症通常指阿尔茨海默病，是一种慢性、进行性的神经退行性疾病，并非正常衰老。</p>
<div class="img-box">
<!-- 直接内嵌 SVG，避免 base64 / img 兼容问题 -->
<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;border-radius:8px;background:#f5f7fa">
  <rect width="640" height="360" fill="#f5f7fa" />
  <g transform="translate(40,60)">
    <rect width="250" height="240" rx="18" fill="#e6fffa" stroke="#1f4fd8" stroke-width="2" />
    <text x="125" y="-15" text-anchor="middle" font-size="18" fill="#222">正常大脑</text>
    <circle cx="125" cy="120" r="85" fill="#bee3f8" />
    <text x="125" y="220" text-anchor="middle" font-size="14" fill="#222">结构完整</text>
  </g>
  <g transform="translate(350,60)">
    <rect width="250" height="240" rx="18" fill="#fff5f5" stroke="#c53030" stroke-width="2" />
    <text x="125" y="-15" text-anchor="middle" font-size="18" fill="#222">阿尔茨海默病</text>
    <circle cx="125" cy="120" r="65" fill="#feb2b2" />
    <text x="125" y="220" text-anchor="middle" font-size="14" fill="#222">明显萎缩</text>
  </g>
</svg>
</div>
</section>

<section>
<h2 id="h2">常见症状</h2>
<ul id="list1">
<li>近期记忆力明显下降</li>
<li>容易迷路或搞混时间</li>
<li>语言表达困难</li>
<li>性格与情绪改变</li>
</ul>
</section>

<section>
<h2 id="h3">早期自测（非诊断）</h2>
<ul id="list2">
<li>是否经常忘记刚发生的事情？</li>
<li>是否反复询问同样问题？</li>
<li>是否对熟悉的路线感到陌生？</li>
</ul>
<p id="p2">如多项为“是”，建议尽早前往正规医院就诊。</p>
</section>
</main>

<footer>
<p id="foot">本页面仅用于健康科普，不替代专业医疗建议。</p>
</footer>

<script>
let lang='zh';
function switchLang(){
  const zh = lang === 'zh';
  lang = zh ? 'en' : 'zh';
  document.getElementById('title').innerText = zh ? "Alzheimer’s Disease" : "老年痴呆症（阿尔茨海默病）";
  document.getElementById('subtitle').innerText = zh ? "Understand · Detect Early · Care Properly" : "认识疾病 · 早期发现 · 科学照护";
  document.getElementById('h1').innerText = zh ? "What is Alzheimer’s Disease?" : "什么是老年痴呆症？";
  document.getElementById('p1').innerText = zh ? "Alzheimer’s disease is a chronic, progressive neurodegenerative disorder and is not a normal part of aging." : "老年痴呆症通常指阿尔茨海默病，是一种慢性、进行性的神经退行性疾病，并非正常衰老。";
  document.getElementById('h2').innerText = zh ? "Common Symptoms" : "常见症状";
  document.getElementById('list1').innerHTML = zh
    ? "<li>Significant memory loss</li><li>Disorientation in time or place</li><li>Difficulty speaking</li><li>Personality and mood changes</li>"
    : "<li>近期记忆力明显下降</li><li>容易迷路或搞混时间</li><li>语言表达困难</li><li>性格与情绪改变</li>";
  document.getElementById('h3').innerText = zh ? "Simple Self-Check (Not Diagnostic)" : "早期自测（非诊断）";
  document.getElementById('list2').innerHTML = zh
    ? "<li>Do you forget recent events?</li><li>Do you repeat the same questions?</li><li>Do familiar places feel unfamiliar?</li>"
    : "<li>是否经常忘记刚发生的事情？</li><li>是否反复询问同样问题？</li><li>是否对熟悉的路线感到陌生？</li>";
  document.getElementById('p2').innerText = zh ? "If several answers are yes, seek medical advice early." : "如多项为“是”，建议尽早前往正规医院就诊。";
  document.getElementById('foot').innerText = zh ? "This page is for educational purposes only." : "本页面仅用于健康科普，不替代专业医疗建议。";
}else{
    location.reload();
  }
}
function toggleFont(){document.body.classList.toggle('big-font');}
</script>
</body>
</html>
